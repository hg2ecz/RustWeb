[package]
name = "rwlang-server"
version = "0.1.0"
edition = "2024"

[dependencies]
auth = { path = "../auth" }
compiler = { path = "../compiler" }
data = { path = "../data" }
language-core = { path = "../language-core" }
runtime = { path = "../runtime" }
storage = { path = "../storage" }
observability = { path = "../observability" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal", "sync"] }

rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"

ipnet = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
