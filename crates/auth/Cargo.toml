[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
rand = "0.10.2"
subtle = "2.6"
sha2 = "0.10"
argon2 = "0.5.3"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }
totp-rfc = "0.1.2"

data = { path = "../data" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
