[package]
name = "migrations"
version = "0.1.0"
edition = "2024"

[dependencies]
data = { path = "../data" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "postgres", "mysql", "sqlite"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }
